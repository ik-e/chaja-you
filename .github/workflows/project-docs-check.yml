name: project-docs-check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile projection tool
        run: python -m py_compile tools/project_docs.py
      - name: Validate canonical artifacts and projections
        run: python tools/project_docs.py --check
