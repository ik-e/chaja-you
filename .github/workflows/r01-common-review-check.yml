name: r01-common-review-check
on:
  workflow_dispatch:
  push:
    branches: [r01/product-integration]
permissions:
  contents: read
jobs:
  projections:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate and validate projections in isolated checkout
        run: |
          node tools/generate_lesson_design_review.mjs --source 197987047ea9a305072bba3fdff816c5c37b0157 --main 9b6ff0463722372d577747e89cb853e773c78591
          node tools/generate_lesson_design_review.mjs --check
          python tools/project_docs.py
          python tools/project_docs.py --check
      - name: Emit regenerated tracked projection changes for review (no remote write)
        if: always()
        run: |
          python - <<'PY'
          import json, subprocess, pathlib
          for p in subprocess.check_output(['git','diff','--name-only','-z'],text=True).split('\0'):
              if not p: continue
              value = pathlib.Path(p).read_text(encoding='utf-8')
              parts = [value[i:i+4000] for i in range(0,len(value),4000)]
              for i, part in enumerate(parts):
                  print('PROJECTION_PART '+json.dumps({'path':p,'part':i,'total':len(parts),'text':part},ensure_ascii=True))
          PY
      - name: Existing deliverable mapping
        run: python tools/check_deliverables.py
  bootstrap-and-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: product/lesson-registration
    env:
      LR_ENVIRONMENT: mock
      PYTHONPATH: .:src
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.10.0'
          python-version: '3.12'
          enable-cache: false
      - name: Existing locked bootstrap regression
        run: |
          uv sync --locked --python 3.12
          uv run --locked --python 3.12 python dev.py doctor
          uv run --locked --python 3.12 python dev.py test all
      - name: Standard JSON Schema and implementation binding candidate tests
        run: uv run --no-project --python 3.12 --with jsonschema==4.25.1 python -m unittest discover -s tests/contract/standard_schema -v
      - name: Scope
        if: always()
        run: echo 'Candidate contract and synthetic replay checks only. Integrated product acceptance not executed.'
