<!doctype html><html lang="ko"><meta charset="utf-8"><title>R03 레슨 등록 PoC</title><style>body{font:16px system-ui;background:#f3f5f8;max-width:960px;margin:40px auto;color:#203047}section{background:white;padding:24px;margin:20px 0;border-radius:12px}textarea{width:95%}input,button{padding:10px;margin:5px}button{background:#194e8e;color:white;border:0;border-radius:5px}pre{white-space:pre-wrap;overflow-wrap:anywhere}label{display:block}</style><h1>레슨 공고 → 모의 등록</h1><p>로컬 단일 사용자 시험 · 실제 크몽 제출 없음 · 현재 실행기는 시험 세션을 시작하면 표시됩니다.</p><section><h2>1. 원본 입력</h2><button id="startSession" type="button">시험 세션 시작</button><span id="sessionStatus" role="status" aria-live="polite">세션 시작 전</span><form id="source"><textarea name="source_text" rows="5" placeholder="기존 레슨 소개글" required></textarea><label>월 가격<input name="monthly_price" type="number" value="300000"></label><label>월 횟수<input name="sessions_per_month" type="number" value="4"></label><label>회당 분<input name="minutes_per_session" type="number" value="90"></label><label>공개 지역<input name="location_public" required></label><input name="images" type="file" accept="image/png,image/jpeg" multiple><button>저장·미리보기</button></form></section><section><h2>2. 미리보기 수정</h2><p>빈 문구·카테고리·모집 형태·패키지 제목/설명·기간/수정 횟수·제공 여부를 직접 확인해 입력하세요. 모델 미설정 시 AI 생성은 실행되지 않습니다.</p><textarea id="editor" rows="24"></textarea><button onclick="save()">변경값 검증·새 버전 저장</button><pre id="validation"></pre></section><section><h2>3. 1건 승인</h2><label><input id="confirmed" type="checkbox">현재 문구·가격·사진으로 모의 접수 1건을 승인합니다</label><select id="fault"><option value="none">정상</option><option>upload_failure</option><option>session_expired</option><option>response_lost</option><option>no_receipt</option></select><button onclick="submitJob()">승인 후 모의 등록</button></section><section><h2>4. 결과·영수증</h2><pre id="output"></pre></section><script>
const source=document.getElementById('source'), editor=document.getElementById('editor'), validation=document.getElementById('validation'), confirmed=document.getElementById('confirmed'), fault=document.getElementById('fault'), output=document.getElementById('output');let csrf='',lesson,preview;async function api(path,body,method='POST',extra={}){let r=await fetch(path,{method,headers:{'x-csrf-token':csrf,...(body instanceof FormData?{}:{'Content-Type':'application/json'}),...extra},body:body===undefined?undefined:body instanceof FormData?body:JSON.stringify(body)});let d=await r.json();if(!r.ok)throw Error(JSON.stringify(d));return d;}function show(p){preview=p;editor.value=JSON.stringify(p.fields,null,2);validation.textContent=JSON.stringify({status:p.status,version:p.preview_version,missing:p.missing_fields},null,2);confirmed.checked=false;}async function start(){const status=document.getElementById('sessionStatus');status.textContent='연결 중...';try{const session=await api('/api/session',{});csrf=session.csrf;lesson=undefined;preview=undefined;editor.value='';validation.textContent='';confirmed.checked=false;status.textContent='시험 세션 준비 완료 · 실행기: '+session.runner;output.textContent='시험 세션 준비 완료';}catch(e){status.textContent='세션 시작 실패: '+e.message;}}document.getElementById('startSession').addEventListener('click',start);source.onsubmit=async e=>{e.preventDefault();try{if(!csrf)throw Error('먼저 시험 세션 시작을 누르세요');lesson=await api('/api/v1/lessons',new FormData(source));show(await api('/api/v1/lessons/'+lesson.lesson_id+'/prepare',{source_version:1}));}catch(e){output.textContent=e.message;}};async function save(){try{if(!lesson || !preview)throw Error('새로고침 후에는 시험 세션을 시작하고 저장·미리보기를 다시 진행하세요');show(await api('/api/v1/lessons/'+lesson.lesson_id+'/preview',{preview_version:preview.preview_version,fields:JSON.parse(editor.value)},'PATCH'));}catch(e){output.textContent=e.message;}}async function submitJob(){try{if(!lesson || !preview)throw Error('새로고침 후에는 시험 세션을 시작하고 저장·미리보기를 다시 진행하세요');if(!confirmed.checked)throw Error('승인 확인 필요');if(JSON.stringify(JSON.parse(editor.value))!==JSON.stringify(preview.fields))throw Error('수정 내용을 먼저 저장하세요');let a=await api('/api/v1/lessons/'+lesson.lesson_id+'/approve',{preview_version:preview.preview_version});let j=await api('/api/v1/jobs',{lesson_id:lesson.lesson_id,preview_version:preview.preview_version,approval_token:a.approval_token,target:'mock_kmong',mode:'mock',fault:fault.value},'POST',{'Idempotency-Key':crypto.randomUUID()});for(let i=0;i<120;i++){let r=await api('/api/v1/jobs/'+j.job_id,undefined,'GET');output.textContent=JSON.stringify(r,null,2);if(!['queued','running'].includes(r.status))break;await new Promise(r=>setTimeout(r,1000));}}catch(e){output.textContent=e.message;}}
</script></html>
