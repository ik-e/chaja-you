<!doctype html><html lang="ko"><meta charset="utf-8"><title>모의 등록</title><style>body{font:16px system-ui;max-width:850px;margin:40px auto}label{display:block;margin:15px 0}textarea{display:block;width:95%;min-height:48px}button{padding:12px}</style><h1>크몽형 모의 접수 — 실제 등록 아님</h1><form id="f">__FIELDS__<p><input id="image" name="image" type="file" accept="image/png,image/jpeg" required></p><button id="submit">모의 제출</button></form><pre id="result"></pre><script>
const shape=__SHAPE__;
f.onsubmit=async e=>{e.preventDefault();const fields=structuredClone(shape);for(const input of document.querySelectorAll('[data-path]')){const path=input.dataset.path.split('.');let obj=fields;for(const part of path.slice(0,-1))obj=obj[part];const key=path.at(-1);const old=obj[key];obj[key]=typeof old==='boolean'?input.value==='true':typeof old==='number'?Number(input.value):old===null&&input.value===''?null:input.value;}const form=new FormData(f);form.set('payload',JSON.stringify(fields));const r=await fetch('/mock-kmong/__JOB__/submit',{method:'POST',body:form});result.textContent=JSON.stringify(await r.json(),null,2);};
</script></html>
