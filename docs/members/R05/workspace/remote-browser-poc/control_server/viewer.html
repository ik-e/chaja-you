<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>원격 브라우저 (PoC)</title>
<style>
  body { margin: 0; font-family: sans-serif; background: #1f2230; color: #eee; }
  .bar { display: flex; gap: 8px; align-items: center; padding: 8px 12px; background: #2b2f42; flex-wrap: wrap; }
  .bar button { padding: 6px 10px; }
  #state { font-size: 13px; margin-left: auto; }
  #wrap { padding: 12px; }
  canvas { background: #000; width: 100%; max-width: 1280px; aspect-ratio: 1280 / 800; outline: 2px solid #555; cursor: default; }
  canvas:focus { outline-color: #8ea2ff; }
  .locked canvas { outline-color: #e0a030; cursor: not-allowed; }
  dialog form label { display: block; margin: 6px 0; }
</style>
</head>
<body>
<div class="bar">
  <strong>원격 브라우저</strong>
  <button id="btn-back">뒤로</button>
  <button id="btn-reload">새로고침</button>
  <button id="btn-handoff">등록 작업을 서버에 맡기기</button>
  <button id="btn-return">제어권 돌려받기</button>
  <button id="btn-end">세션 종료</button>
  <span id="state">연결 중…</span>
</div>
<div id="wrap"><canvas id="screen" width="1280" height="800" tabindex="0"></canvas></div>

<dialog id="dlg">
  <form method="dialog" id="job-form">
    <h3>서버에 맡길 등록 내용 (모의 사이트)</h3>
    <label>제목 <input name="title" maxlength="30" required></label>
    <label>설명 <textarea name="description" required></textarea></label>
    <label>가격 <input name="price" type="number" min="0" required></label>
    <label>대표 이미지 <input name="image" type="file" accept="image/png,image/jpeg" required></label>
    <button value="ok">맡기기</button> <button value="cancel" formnovalidate>취소</button>
  </form>
</dialog>

<script>
const sid = location.pathname.split('/').pop();
// 토큰은 URL 해시로 전달받고(서버 접속 로그에 남지 않음) 즉시 주소창에서 지운다.
const token = new URLSearchParams(location.hash.slice(1)).get('t');
history.replaceState(null, '', location.pathname);
const canvas = document.getElementById('screen');
const ctx = canvas.getContext('2d');
const stateEl = document.getElementById('state');
let control = 'user';

const ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws/${sid}`);
ws.onopen = () => ws.send(JSON.stringify({ t: 'auth', token }));
ws.onclose = () => { stateEl.textContent = '연결 끊김 (서버 작업은 계속됨)'; };
ws.onmessage = (m) => {
  const msg = JSON.parse(m.data);
  if (msg.type === 'frame') {
    const img = new Image();
    img.onload = () => ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    img.src = 'data:image/jpeg;base64,' + msg.data;
  } else if (msg.type === 'status') {
    control = msg.control;
    document.body.classList.toggle('locked', control !== 'user');
    const job = msg.job ? ` · 작업: ${msg.job.state}${msg.job.result_state ? ' / ' + msg.job.result_state : ''}` : '';
    stateEl.textContent = `제어: ${control === 'user' ? '사용자' : '서버'} · 페이지: ${msg.page_path}${job}`;
  } else if (msg.type === 'input_rejected') {
    stateEl.textContent = '서버가 작업 중이라 입력이 차단되었습니다.';
  } else if (msg.type === 'closed' || msg.type === 'denied') {
    stateEl.textContent = '세션이 종료되었습니다.';
  }
};
const send = (ev) => ws.readyState === 1 && ws.send(JSON.stringify(ev));

function pos(e) {
  const r = canvas.getBoundingClientRect();
  return { x: (e.clientX - r.left) * 1280 / r.width, y: (e.clientY - r.top) * 800 / r.height };
}
canvas.addEventListener('mousedown', (e) => { canvas.focus(); send({ t: 'mouse', action: 'down', ...pos(e), button: ['left', 'middle', 'right'][e.button] }); });
canvas.addEventListener('mouseup', (e) => send({ t: 'mouse', action: 'up', ...pos(e), button: ['left', 'middle', 'right'][e.button] }));
let lastMove = 0;
canvas.addEventListener('mousemove', (e) => { const n = Date.now(); if (n - lastMove > 50) { lastMove = n; send({ t: 'mouse', action: 'move', ...pos(e) }); } });
canvas.addEventListener('wheel', (e) => { e.preventDefault(); send({ t: 'wheel', dx: e.deltaX, dy: e.deltaY }); }, { passive: false });
canvas.addEventListener('contextmenu', (e) => e.preventDefault());
canvas.addEventListener('keydown', (e) => {
  e.preventDefault();
  if (e.key.length === 1 && !e.ctrlKey && !e.metaKey) send({ t: 'text', text: e.key });
  else send({ t: 'key', key: (e.ctrlKey ? 'Control+' : '') + e.key });
});
// 한글 등 조합 입력은 붙여넣기로 보낸다.
canvas.addEventListener('paste', (e) => send({ t: 'text', text: e.clipboardData.getData('text') }));

const api = (path, opts = {}) => fetch(`/api/sessions/${sid}${path}`, {
  ...opts, headers: { 'X-Session-Token': token, 'Content-Type': 'application/json', ...(opts.headers || {}) },
});
document.getElementById('btn-back').onclick = () => send({ t: 'nav', action: 'back' });
document.getElementById('btn-reload').onclick = () => send({ t: 'nav', action: 'reload' });
document.getElementById('btn-return').onclick = async () => {
  let r = await api('/return', { method: 'POST' });
  if (r.status === 409 && confirm('서버 작업이 진행 중입니다. 중단하고 제어권을 돌려받을까요?')) {
    r = await api('/return?cancel=true', { method: 'POST' });
  }
};
document.getElementById('btn-end').onclick = async () => {
  if (confirm('세션을 종료하면 원격 브라우저의 로그인 상태가 삭제됩니다.')) await api('', { method: 'DELETE' });
};
const dlg = document.getElementById('dlg');
document.getElementById('btn-handoff').onclick = () => dlg.showModal();
dlg.addEventListener('close', async () => {
  if (dlg.returnValue !== 'ok') return;
  const f = new FormData(document.getElementById('job-form'));
  const file = f.get('image');
  const buf = new Uint8Array(await file.arrayBuffer());
  let bin = ''; buf.forEach((b) => { bin += String.fromCharCode(b); });
  const r = await api('/handoff', { method: 'POST', body: JSON.stringify({
    title: f.get('title'), description: f.get('description'), price: Number(f.get('price')),
    image_name: file.name, image_b64: btoa(bin),
  }) });
  if (!r.ok) alert('맡기기 실패: ' + r.status);
});
</script>
</body>
</html>
