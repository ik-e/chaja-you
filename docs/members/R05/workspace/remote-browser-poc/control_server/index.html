<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>원격 브라우저 PoC</title></head>
<body style="font-family:sans-serif;padding:24px">
<h2>원격 브라우저 PoC</h2>
<p>새 세션을 만들면 서버의 브라우저 화면이 열립니다. 모의 사이트에 가상 계정으로 직접 로그인한 뒤, 등록 작업을 서버에 맡겨 보세요.</p>
<button id="new">새 세션 만들기</button>
<script>
document.getElementById('new').onclick = async () => {
  const r = await fetch('/api/sessions', { method: 'POST' });
  const s = await r.json();
  location.href = s.viewer_path;
};
</script>
</body>
</html>
