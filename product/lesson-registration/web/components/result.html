<!-- Result Surface: H8, H9 -->
<div id="surface-result" class="surface-pane">
  <div class="card">
    <h2>5. 등록 진행 및 최종 결과 (Progress / Result)</h2>
    <p class="desc">작업 상태와 진행률을 실시간으로 확인하고, 최종 등록 결과를 검증합니다.</p>

    <!-- Progress Box -->
    <div id="progress-container" class="sub-card">
      <div class="progress-header">
        <span>작업 상태: <strong id="job-state-text">대기 중 (Pending)</strong></span>
        <span id="progress-step-text">단계: S1 준비</span>
      </div>
      <div class="progress-bar-bg">
        <div id="progress-bar-fill" class="progress-bar-fill" style="width: 15%;"></div>
      </div>
    </div>

    <!-- Final Result Display -->
    <div id="result-box" class="result-box" style="display: none; margin-top: 1.5rem;">
      <div id="verdict-banner" class="verdict-banner">
        <h3 id="verdict-title">결과 판정</h3>
        <p id="verdict-desc"></p>
      </div>

      <div id="unknown-action-guide" class="alert alert-warning" style="display: none;">
        <strong>수동 확인 필요:</strong>
        <p>응답 유실 또는 불확실(unknown) 상태로 인해 자동 재실행이 차단되었습니다. 플랫폼 관리자 페이지에서 중복 등록 여부를 직접 확인해 주시기 바랍니다.</p>
        <button type="button" id="btn-manual-confirm" class="btn btn-secondary">수동 확인 완료 처리</button>
      </div>

      <div class="evidence-box" style="margin-top: 1rem;">
        <h4>관측 증거 (Evidence)</h4>
        <pre><code id="result-evidence-json">{}</code></pre>
      </div>
    </div>

    <div class="actions" style="margin-top: 1.5rem;">
      <button type="button" id="btn-reset-workflow" class="btn btn-secondary">새 레슨 등록 시작하기</button>
    </div>
  </div>
</div>
