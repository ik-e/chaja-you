[project]
name = "chaja-you"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

# Keep the repository as a script/application workspace until packaging is designed.
[tool.uv]
package = false

# MVP smoke/behavior tests; existing document tooling still runs independently.
[tool.pytest.ini_options]
testpaths = ["prototype/lesson-registration/tests"]
addopts = "-ra"
